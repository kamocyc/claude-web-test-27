<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pool Simulation</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f8fbf'/%3E%3Cpath d='M2 21c3 0 3-3 6-3s3 3 6 3 3-3 6-3 3 3 6 3 3-3 6-3' stroke='%23eaf7ff' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1d2a; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud {
        position: fixed; left: 12px; bottom: 12px; z-index: 10;
        font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: rgba(255, 255, 255, 0.82);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        pointer-events: none; user-select: none;
      }
      #hud b { color: #7fe3ff; font-weight: 600; }
      #fatal {
        position: fixed; inset: 0; z-index: 100; display: none;
        place-content: center; padding: 32px; text-align: center;
        font: 14px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #ffd7d7; background: #2a0b0b;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <b>WASD</b> swim &nbsp; <b>Shift</b> sprint &nbsp; <b>Space</b> dive &nbsp;
      <b>Drag</b> orbit &nbsp; <b>Wheel</b> zoom &nbsp; <b>Click water</b> splash
    </div>
    <div id="fatal"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
